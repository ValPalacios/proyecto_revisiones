<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Llamadas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Llamadas Ficticias</h1>
        
        <div id="mensaje-estado" class="estado" aria-live="polite"></div>

        <form id="form-llamada">
            <input type="hidden" id="llamada-id">
            
            <label for="nombre_archivo">Nombre del archivo:</label>
            <input type="text" id="nombre_archivo" required maxlength="200">

            <label for="duracion_seg">Duración (segundos):</label>
            <input type="number" id="duracion_seg" required min="1" max="86400">

            <label for="fecha_llamada">Fecha y hora local:</label>
            <input type="datetime-local" id="fecha_llamada" required>

            <div class="botones">
                <button type="submit" id="btn-guardar">Crear Llamada</button>
                <button type="button" id="btn-cancelar" hidden>Cancelar</button>
            </div>
        </form>

        <h2>Listado</h2>
        <ul id="lista-llamadas"></ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
